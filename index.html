<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 500; i += 1) {
            var star = document.createElement("a-sphere");
            var radius = 70;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);

            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#FFB6C1");
            star.setAttribute("material", "shader: flat; emissive: #FF69B4; emissiveIntensity: 1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        },
      });
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
      }
    </style>
  </head>
  <body>
    <a-scene>
      <a-assets timeout="30000">
        <a-asset-item
          id="customModel"
          src="이지은_202602015_DP_01반_10주차실습.glb"
        ></a-asset-item>
        <a-asset-item
          id="octopusModel"
          src="문어.glb"
        ></a-asset-item>
        <img id="skyTexture" src="하늘.png" />
        <img id="leeTexture" src="LEE.png" />
      </a-assets>

      <a-sky src="#skyTexture"></a-sky>
      <a-entity starfield></a-entity>

      <a-entity light="type: ambient; color: #667085; intensity: 0.8"></a-entity>
      <a-entity
        light="type: point; color: #ffffff; intensity: 1.2; distance: 90"
        position="0 6 6"
      ></a-entity>

      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera position="0 0 0"></a-camera>
      </a-entity>

      <!-- 분홍색 행성 (제자리 자전) -->
      <a-sphere
        position="-3.8 2.6 -5.5"
        radius="0.45"
        color="#E894FF"
        material="metalness: 0.15; roughness: 0.65;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;"
      ></a-sphere>

      <!-- 파란색 행성 (제자리 자전) -->
      <a-sphere
        position="3.8 2.3 -5.5"
        radius="0.55"
        color="#7595FF"
        material="metalness: 0.2; roughness: 0.55;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5500; easing: linear;"
      ></a-sphere>

      <!-- LEE 이미지 (한가운데 배치 및 제자리 자전) -->
      <a-image
        src="#leeTexture"
        position="0 1.8 -3.8"
        width="2.2"
        height="1.17"
        material="side: double; transparent: true;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear;"
      ></a-image>

      <!-- 유모차 3D 모델 (제자리 자전) -->
      <a-entity
        gltf-model="#customModel"
        position="-1.5 1.0 -4"
        scale="2 2 2"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear;"
      ></a-entity>

      <!-- 문어 3D 모델 (제자리 자전) -->
      <a-entity
        gltf-model="#octopusModel"
        position="1.5 1.0 -4"
        scale="1.8 1.8 1.8"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear;"
      ></a-entity>
    </a-scene>
  </body>
</html>
